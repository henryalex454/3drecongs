name: Build & Refresh Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/3Drecon-latest.apk'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & build Vite PWA
        run: |
          npm ci
          npm run build

      - name: Package Android project with Capacitor
        run: |
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: Ensure Android Camera & Hardware WebGL Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$MANIFEST"
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare 3Drecon-latest.apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/3Drecon-latest.apk

      - name: Commit fresh APK to dist/3Drecon-latest.apk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/3Drecon-latest.apk
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh dist/3Drecon-latest.apk [skip ci]"
            git push
          fi

      - name: Publish Latest GitHub Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 3Drecon Studio v3.0 (Latest APK)
          body: |
            Otomatik derlenen en güncel **3Drecon Studio v3.0** Android APK paketi.
            - Birleşik TSDF + Surface Nets + Taubin pürüzsüz mesh
            - Yan oda duvar oklüzyonu & derinlik testli 3B anchorlar
            - Aynalı yüzey koruma & 8–45 cm Makro modu
            - Tüm 7 görünüm/meshleme modu (AR, Mesh, AR+Tel, Tel Kafes, Normal, Derinlik, Nokta)
          files: dist/3Drecon-latest.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
